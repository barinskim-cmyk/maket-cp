# ─────────────────────────────────────────────────────────────
# Сборка десктопных пакетов Content Pulse:
#   1. Content Pulse.app        (macOS, pywebview + backend)
#   2. Content Pulse (win)      (Windows, onedir zip)
#   3. Rate Setter.app          (macOS, tkinter standalone)
#   4. Rate Setter .exe         (Windows, onefile)
# Все артефакты — в release с тегом desktop-latest.
# Запуск: вручную (workflow_dispatch) через gh workflow run build-desktop.yml
# ─────────────────────────────────────────────────────────────
name: Build desktop apps

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r v2/backend/requirements.txt pyinstaller

      - name: Build Content Pulse.app
        run: |
          pyinstaller --noconfirm --windowed \
            --name "Content Pulse" \
            --osx-bundle-identifier "pulse.content.desktop" \
            --add-data "v2/frontend:frontend" \
            --hidden-import PIL._tkinter_finder \
            --collect-all pdfplumber \
            --collect-all openpyxl \
            --paths v2/backend \
            v2/backend/main.py
          # Снять quarantine-совместимую подпись ad-hoc, чтобы app запускался
          codesign --force --deep -s - "dist/Content Pulse.app" || true
          cd dist && ditto -c -k --keepParent "Content Pulse.app" "Content-Pulse-macOS.zip"

      - name: Build Rate Setter.app
        run: |
          cd rate-setter-standalone
          pyinstaller --noconfirm "C1 Rate Setter.spec"
          codesign --force --deep -s - "dist/Content Pulse Rate Setter.app" || true
          cp instruction.html dist/
          cd dist && ditto -c -k --keepParent "Content Pulse Rate Setter.app" "Content-Pulse-Rate-Setter-macOS.zip"

      - name: Smoke check bundles
        run: |
          test -d "dist/Content Pulse.app/Contents/MacOS"
          # фронтенд должен быть внутри сборки
          find "dist/Content Pulse.app" -name index.html | grep -q frontend
          test -d "rate-setter-standalone/dist/Content Pulse Rate Setter.app/Contents/MacOS"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-builds
          path: |
            dist/Content-Pulse-macOS.zip
            rate-setter-standalone/dist/Content-Pulse-Rate-Setter-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # pyobjc-строки в requirements помечены sys_platform == "darwin" и пропустятся
          pip install -r v2/backend/requirements.txt pyinstaller

      - name: Build Content Pulse (win, onedir)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed `
            --name "Content Pulse" `
            --add-data "v2/frontend;frontend" `
            --hidden-import PIL._tkinter_finder `
            --collect-all pdfplumber `
            --collect-all openpyxl `
            --collect-all webview `
            --paths v2/backend `
            v2/backend/main.py
          Compress-Archive -Path "dist/Content Pulse" -DestinationPath "dist/Content-Pulse-Windows.zip"

      - name: Build Rate Setter .exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "Content Pulse Rate Setter" `
            rate-setter-standalone/C1_RateSetter.py
          Copy-Item "rate-setter-standalone/instruction.html" "dist/"

      - name: Smoke check
        shell: pwsh
        run: |
          if (!(Test-Path "dist/Content Pulse/Content Pulse.exe")) { Write-Error "no app exe"; exit 1 }
          if (!(Test-Path "dist/Content Pulse Rate Setter.exe")) { Write-Error "no rate setter exe"; exit 1 }
          $idx = Get-ChildItem -Recurse "dist/Content Pulse" -Filter index.html
          if (!$idx) { Write-Error "frontend not bundled"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: win-builds
          path: |
            dist/Content-Pulse-Windows.zip
            dist/Content Pulse Rate Setter.exe

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true
      - name: Rename win exe (без пробелов для release)
        run: |
          ls -R art
          mv "art/Content Pulse Rate Setter.exe" "art/Content-Pulse-Rate-Setter-Windows.exe"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: "Content Pulse — Desktop builds"
          body: |
            Автосборка десктопных пакетов Content Pulse.
            - Content-Pulse-macOS.zip — приложение для Mac
            - Content-Pulse-Windows.zip — приложение для Windows (распаковать, запустить Content Pulse.exe)
            - Content-Pulse-Rate-Setter-macOS.zip — Rate Setter для Mac
            - Content-Pulse-Rate-Setter-Windows.exe — Rate Setter для Windows
            Инструкция к Rate Setter: rate-setter-standalone/instruction.html
          files: |
            art/Content-Pulse-macOS.zip
            art/Content-Pulse-Windows.zip
            art/Content-Pulse-Rate-Setter-macOS.zip
            art/Content-Pulse-Rate-Setter-Windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
