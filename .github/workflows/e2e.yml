name: E2E Tests

# 2026-07-02: continue-on-error снят (аудит audit0702-ci-block) —
# красный e2e теперь блокирует merge. Продуктовые smoke-тесты
# добавлены (tests/e2e/active/product-smoke.spec.ts).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # package-lock.json может отсутствовать (dev-only harness); fallback на install.
        run: npm ci || npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          MAKET_LANDING_URL: https://barinskim-cmyk.github.io/maket-landing/
          MAKET_PRODUCT_URL: https://barinskim-cmyk.github.io/maket-cp/
          MAKET_SHARE_TOKEN: ${{ secrets.MAKET_SHARE_TOKEN }}
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
