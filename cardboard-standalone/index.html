<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardboard — вёрстка карточек товара</title>
<style>
/* ============================================================
   Cardboard — standalone инструмент вёрстки карточек товара.
   Dual-mode: desktop (pywebview + Python, фото по путям, ничего
   не копируется) и браузерный фолбэк (фото встраиваются в проект).
   Семейство инструментов Content Pulse (как Rate Setter).
   ============================================================ */

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 13px;
  color: #1a1a1a;
  background: #f2f1ef;
  height: 100vh;
  overflow: hidden;
}

button {
  font-family: inherit;
  font-size: 12px;
  padding: 6px 12px;
  border: 1px solid #c8c5c0;
  background: #fff;
  color: #1a1a1a;
  cursor: pointer;
  border-radius: 3px;
  white-space: nowrap;   /* кнопки не ломаются на несколько строк */
  flex-shrink: 0;
}
button:hover { background: #eceae7; }
button.cb-primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
button.cb-primary:hover { background: #3a3a3a; }
button.cb-danger:hover { background: #f6e3e0; border-color: #c96; }

input[type="text"], select, textarea {
  font-family: inherit;
  font-size: 12px;
  padding: 5px 8px;
  border: 1px solid #c8c5c0;
  border-radius: 3px;
  background: #fff;
}
input[type="text"]:focus, textarea:focus { outline: none; border-color: #1a1a1a; }

/* ---------- Верхняя панель ---------- */
.cb-topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 48px;
  padding: 0 14px;
  background: #fff;
  border-bottom: 1px solid #dcd9d4;
  flex-wrap: nowrap;
  overflow-x: auto;      /* узкое окно: панель скроллится, не расползается */
  overflow-y: hidden;
}
.cb-topbar .cb-logo, .cb-topbar .cb-grid-ctl, .cb-topbar span { white-space: nowrap; flex-shrink: 0; }
.cb-topbar input, .cb-topbar select { flex-shrink: 0; }
.cb-logo {
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 2px;
  margin-right: 6px;
}
.cb-logo span { color: #8a8680; font-weight: 400; letter-spacing: 0; font-size: 11px; margin-left: 6px; }
#cbProjectName { width: 180px; font-weight: 600; }
.cb-topbar .cb-sep { width: 1px; height: 24px; background: #dcd9d4; margin: 0 4px; }
.cb-topbar .cb-spacer { flex: 1; }
#cbMode { font-size: 10px; color: #8a8680; }

/* ---------- Попап «Поделиться» ---------- */
.cb-share-wrap { position: relative; flex-shrink: 0; }
#cbSharePop {
  display: none;
  /* fixed, а не absolute: топбар скроллится (overflow), absolute-попап
     резался бы его рамкой и «не открывался» */
  position: fixed;
  top: 50px;
  right: 12px;
  background: #fff;
  border: 1px solid #c8c5c0;
  border-radius: 4px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  padding: 6px;
  z-index: 120;
  min-width: 190px;
  flex-direction: column;
  gap: 4px;
}
#cbSharePop.cb-open { display: flex; }
#cbSharePop button { border: none; text-align: left; width: 100%; padding: 8px 10px; }
.cb-share-sep { height: 1px; background: #eceae7; margin: 2px 0; }
.cb-share-mode { font-size: 10px; color: #8a8680; padding: 2px 10px 4px; text-align: right; }

/* ---------- Основной лейаут ---------- */
.cb-main {
  display: flex;
  height: calc(100vh - 48px);
}

/* ---------- Левая панель: фото ---------- */
.cb-tray {
  width: 300px;
  min-width: 160px;
  max-width: 720px;
  background: #fff;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
/* Перетаскиваемая граница галереи (как в Capture One) */
.cb-resizer {
  width: 5px;
  flex-shrink: 0;
  cursor: col-resize;
  background: #dcd9d4;
  border-left: 2px solid #fff;
  border-right: 2px solid #f2f1ef;
  transition: background 0.15s;
}
.cb-resizer:hover, .cb-resizer.cb-dragging { background: #1a1a1a; }
body.cb-resizing { cursor: col-resize; user-select: none; -webkit-user-select: none; }
body.cb-resizing .cb-work, body.cb-resizing .cb-tray { pointer-events: none; }
.cb-tray-head {
  padding: 10px 12px 8px;
  border-bottom: 1px solid #eceae7;
}
.cb-tray-head .cb-row { display: flex; gap: 6px; margin-bottom: 6px; }
.cb-tray-head .cb-row:last-child { margin-bottom: 0; }
#cbFilter { flex: 1; }
.cb-tray-stats { font-size: 11px; color: #8a8680; padding: 6px 12px; border-bottom: 1px solid #eceae7; }
#cbWatchStatus { font-size: 11px; color: #2a7a2a; padding: 6px 12px 6px; display: none; border-bottom: 1px solid #eceae7; }

/* Библиотека превью — по аналогии с pv-gallery основной проги:
   вертикальное фото = 1/3 ряда, горизонтальное = 2/3, flex-grow добивает ряд */
.cb-tray-grid {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  align-content: flex-start;
}
.cb-thumb {
  width: calc((100% - 8px) / 3);
  flex-grow: 1;
  cursor: grab;
  border: 2px solid transparent;
  overflow: hidden;
  position: relative;
  transition: border-color 0.15s;
}
.cb-thumb.cb-h { width: calc(2 * (100% - 8px) / 3 + 4px); }
.cb-thumb:hover { border-color: #1a1a1a; }
.cb-thumb:active { cursor: grabbing; }
.cb-thumb img {
  width: 100%;
  height: auto;
  max-height: 320px;
  object-fit: cover;
  display: block;
  pointer-events: none;
}
.cb-thumb.cb-used { opacity: 0.4; }
.cb-thumb.cb-used::after {
  content: "в макете";
  position: absolute;
  top: 4px; left: 4px;
  font-size: 9px;
  background: #1a1a1a;
  color: #fff;
  padding: 1px 5px;
  border-radius: 2px;
}
.cb-missing-box {
  width: 100%;
  height: 110px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: #b04a3a;
  background: #f9efed;
}
.cb-tray-empty {
  width: 100%;
  color: #8a8680;
  font-size: 12px;
  text-align: center;
  padding: 40px 16px;
  line-height: 1.6;
  border: 1px dashed #c8c5c0;
  border-radius: 4px;
}

/* ---------- Рабочая область ---------- */
.cb-work {
  flex: 1;
  overflow-y: auto;
  padding: 18px 22px 80px;
}
/* ---------- Вкладки: Карточки / Доп. контент ---------- */
.cb-tabs {
  display: flex;
  gap: 0;
  margin-bottom: 16px;
  border-bottom: 1px solid #dcd9d4;
}
.cb-tab {
  border: none;
  background: none;
  border-radius: 0;
  padding: 8px 16px 10px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #8a8680;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.cb-tab:hover { background: none; color: #1a1a1a; }
.cb-tab.cb-tab-active { color: #1a1a1a; border-bottom-color: #1a1a1a; }
.cb-empty-hint {
  color: #8a8680;
  font-size: 12px;
  padding: 14px;
  border: 1px dashed #c8c5c0;
  border-radius: 4px;
  margin-bottom: 10px;
}

/* ---------- Карточка ---------- */
.cb-card, .cb-container {
  background: #fff;
  border: 1px solid #dcd9d4;
  border-radius: 4px;
  margin: 0 auto 16px;
  max-width: 780px;         /* как lay-container в основной проге */
  padding: 12px 14px 14px;
}
.cb-card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.cb-card-head .cb-num {
  font-weight: 700;
  font-size: 12px;
  color: #8a8680;
  min-width: 24px;
}
.cb-card-head input.cb-title { width: 220px; font-weight: 600; }
.cb-card-head input.cb-cat { width: 140px; }
.cb-card-head .cb-spacer { flex: 1; }
.cb-card-head .cb-grid-ctl { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #8a8680; }
.cb-card-head .cb-grid-ctl button { padding: 2px 8px; }
.cb-mini { padding: 3px 8px; font-size: 11px; }

/* Слоты по аналогии с layout основной проги: ячейка с фиксированной
   пропорцией (3:4, вертикальный продуктовый кадр), фото заполняет ячейку
   целиком (cover) — никаких «окошек непонятного размера». */
.cb-slots { display: flex; flex-direction: column; gap: 4px; }
.cb-slot-row { display: flex; gap: 4px; align-items: stretch; }
.cb-slot {
  flex: 1;
  min-width: 0;
  aspect-ratio: 3 / 4;
  border: 1px dashed #c8c5c0;
  background: #fafaf9;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.cb-slot.cb-filled { border-style: solid; border-color: #e4e2de; background: #fff; }
.cb-slot.cb-over { border-color: #1a1a1a; background: #eceae7; }
.cb-slot img {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;
}
.cb-slot .cb-slot-hint { color: #b5b1ab; font-size: 11px; text-align: center; padding: 0 6px; }
.cb-slot .cb-slot-tag {
  position: absolute;
  top: 4px; left: 4px;
  font-size: 9px;
  background: rgba(255,255,255,0.9);
  border: 1px solid #dcd9d4;
  color: #55524e;
  padding: 1px 5px;
  border-radius: 2px;
  max-width: 70%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cb-slot .cb-slot-name {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  font-size: 9px;
  background: rgba(255,255,255,0.85);
  color: #55524e;
  padding: 2px 5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: none;
}
.cb-slot.cb-filled:hover .cb-slot-name { display: block; }
.cb-slot .cb-slot-x {
  position: absolute;
  top: 4px; right: 4px;
  width: 18px; height: 18px;
  line-height: 16px;
  text-align: center;
  border: 1px solid #c8c5c0;
  border-radius: 2px;
  background: #fff;
  cursor: pointer;
  font-size: 11px;
  display: none;
  padding: 0;
}
.cb-slot.cb-filled:hover .cb-slot-x { display: block; }

/* ---------- Контейнер (доп. контент) ---------- */
.cb-container-body {
  min-height: 90px;
  border: 1px dashed #c8c5c0;
  border-radius: 3px;
  background: #fafaf9;
  padding: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-content: flex-start;
}
.cb-container-body.cb-over { border-color: #1a1a1a; background: #eceae7; }
.cb-container-body .cb-cont-hint { color: #b5b1ab; font-size: 11px; width: 100%; text-align: center; padding: 24px 0; }
.cb-cont-item { position: relative; border: 1px solid #e4e2de; background: #fff; border-radius: 3px; cursor: grab; }
.cb-cont-item img { display: block; object-fit: contain; background: #f2f1ef; pointer-events: none; }
.cb-size-s .cb-cont-item img, .cb-size-s .cb-cont-item .cb-missing-box { width: 90px; height: 90px; }
.cb-size-m .cb-cont-item img, .cb-size-m .cb-cont-item .cb-missing-box { width: 150px; height: 150px; }
.cb-size-l .cb-cont-item img, .cb-size-l .cb-cont-item .cb-missing-box { width: 240px; height: 240px; }
.cb-cont-item .cb-slot-x { display: none; }
.cb-cont-item:hover .cb-slot-x { display: block; }
.cb-cont-item.cb-over { outline: 2px solid #1a1a1a; }
.cb-container textarea {
  width: 100%;
  margin-top: 8px;
  min-height: 40px;
  resize: vertical;
}

/* ---------- Навигация по карточкам/контейнерам (правая панель) ---------- */
.cb-outline {
  width: 190px;
  min-width: 150px;
  background: #fff;
  border-left: 1px solid #dcd9d4;
  overflow-y: auto;
  padding: 12px 0;
}
.cb-outline-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #8a8680;
  padding: 0 14px 8px;
}
.cb-outline-item {
  display: block;
  width: 100%;
  border: none;
  background: none;
  border-radius: 0;
  text-align: left;
  padding: 7px 14px;
  font-size: 12px;
  color: #1a1a1a;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  border-left: 2px solid transparent;
}
.cb-outline-item:hover { background: #f2f1ef; }
.cb-outline-item .cb-outline-num { color: #8a8680; margin-right: 6px; }
.cb-outline-item .cb-outline-count { color: #8a8680; font-size: 10px; margin-left: 4px; }
.cb-outline-empty { font-size: 11px; color: #8a8680; padding: 4px 14px; }

/* ---------- Модалка шаблонов ---------- */
#cbTplModal {
  position: fixed;
  inset: 0;
  background: rgba(26,26,26,0.45);
  display: none;
  align-items: flex-start;
  justify-content: center;
  z-index: 90;
  padding-top: 60px;
}
#cbTplModal.cb-open { display: flex; }
.cb-tpl-panel {
  background: #fff;
  border-radius: 6px;
  width: 560px;
  max-height: 80vh;
  overflow-y: auto;
  padding: 18px 20px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.25);
}
.cb-tpl-panel h2 { font-size: 14px; margin-bottom: 12px; }
.cb-tpl-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.cb-tpl-row label { font-size: 11px; color: #8a8680; }
#cbTplName { width: 200px; font-weight: 600; }
.cb-tpl-slots { display: flex; flex-direction: column; gap: 4px; margin: 10px 0; max-width: 400px; }
.cb-tpl-slot-row { display: flex; gap: 4px; }
.cb-tpl-slot-row input {
  flex: 1;
  min-width: 0;
  aspect-ratio: 3 / 4;      /* те же пропорции, что у слотов карточки */
  text-align: center;
  background: #fafaf9;
  border-style: dashed;
  border-radius: 0;
}
.cb-tpl-foot { display: flex; gap: 8px; margin-top: 14px; }
.cb-tpl-foot .cb-spacer { flex: 1; }

/* ---------- Дроп файлов на всё окно ---------- */
#cbDropOverlay {
  position: fixed;
  inset: 0;
  background: rgba(26,26,26,0.75);
  color: #fff;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  z-index: 100;
  pointer-events: none;
}
body.cb-file-drag #cbDropOverlay { display: flex; }

/* ---------- Тост ---------- */
#cbToast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #1a1a1a;
  color: #fff;
  padding: 8px 16px;
  border-radius: 4px;
  font-size: 12px;
  display: none;
  z-index: 110;
  max-width: 80%;
}

/* ---------- Печать (экспорт PDF) ---------- */
#cbPrint { display: none; }
@media print {
  body { height: auto; overflow: visible; background: #fff; }
  .cb-topbar, .cb-main, #cbToast, #cbDropOverlay, #cbTplModal { display: none !important; }
  #cbPrint { display: block; font-size: 12px; }
  #cbPrint .cbp-head { margin-bottom: 18px; }
  #cbPrint .cbp-head h1 { font-size: 20px; margin-bottom: 4px; }
  #cbPrint .cbp-head .cbp-meta { color: #666; font-size: 11px; }
  #cbPrint .cbp-block { page-break-inside: avoid; border: 1px solid #ccc; border-radius: 4px; padding: 10px 12px; margin-bottom: 14px; }
  #cbPrint .cbp-block h2 { font-size: 13px; margin-bottom: 8px; }
  #cbPrint .cbp-block h2 .cbp-cat { color: #666; font-weight: 400; font-size: 11px; margin-left: 8px; }
  #cbPrint .cbp-row { display: flex; gap: 6px; margin-bottom: 6px; }
  #cbPrint .cbp-cell { flex: 1; border: 1px solid #e0e0e0; min-height: 40px; overflow: hidden; }
  #cbPrint .cbp-cell-in { display: flex; align-items: center; justify-content: center; min-height: 40px; }
  #cbPrint .cbp-cell img { max-width: 100%; max-height: 170px; display: block; }
  #cbPrint .cbp-slotname { font-size: 9px; color: #888; text-align: center; padding: 1px 3px; border-top: 1px solid #eee; }
  #cbPrint .cbp-flow { display: flex; flex-wrap: wrap; gap: 6px; }
  #cbPrint .cbp-flow img { border: 1px solid #e0e0e0; object-fit: contain; }
  #cbPrint .cbp-text { margin-top: 8px; color: #333; white-space: pre-wrap; }
  #cbPrint .cbp-sec { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #888; margin: 16px 0 10px; page-break-after: avoid; }
}
</style>
</head>
<body>

<div class="cb-topbar">
  <div class="cb-logo">CARDBOARD<span>вёрстка карточек</span></div>
  <input type="text" id="cbProjectName" value="Новый проект" title="Название проекта">
  <div class="cb-sep"></div>
  <button id="cbBtnImport" class="cb-primary">Добавить фото</button>
  <button id="cbBtnFolder" style="display:none">Папка</button>
  <button id="cbBtnWatch" title="Следить за папкой экспорта Capture One">Следить за папкой</button>
  <div class="cb-sep"></div>
  <button id="cbBtnAdd">+ Контейнер</button>
  <span class="cb-grid-ctl" style="font-size:11px;color:#8a8680;">Шаблон:
    <select id="cbTplSelect" title="Шаблон для новых карточек"></select>
  </span>
  <button id="cbBtnTpl" class="cb-mini" title="Редактор шаблонов">Шаблоны...</button>
  <div class="cb-spacer"></div>
  <div class="cb-share-wrap">
    <button id="cbBtnShare" class="cb-primary">Поделиться</button>
    <div id="cbSharePop">
      <button id="cbBtnPdf">Экспорт PDF</button>
      <button id="cbBtnList">Список (CSV + TXT)</button>
      <div class="cb-share-sep"></div>
      <button id="cbBtnSave">Сохранить проект</button>
      <button id="cbBtnOpen">Открыть проект</button>
      <div class="cb-share-mode"><span id="cbMode"></span></div>
    </div>
  </div>
</div>

<div class="cb-main">
  <div class="cb-tray">
    <div class="cb-tray-head">
      <div class="cb-row">
        <input type="text" id="cbFilter" placeholder="Фильтр по имени файла">
      </div>
    </div>
    <div class="cb-tray-stats" id="cbTrayStats">Фото: 0</div>
    <div id="cbWatchStatus"></div>
    <div class="cb-tray-grid" id="cbTrayGrid"></div>
  </div>
  <div class="cb-resizer" id="cbResizer" title="Потяните, чтобы изменить ширину галереи"></div>
  <div class="cb-work" id="cbWork">
    <div class="cb-tabs">
      <button class="cb-tab cb-tab-active" data-tab="cards" id="cbTabBtnCards">Карточки</button>
      <button class="cb-tab" data-tab="conts" id="cbTabBtnConts">Доп. контент</button>
    </div>
    <div id="cbTabCards"><div id="cbCards"></div></div>
    <div id="cbTabConts" style="display:none"><div id="cbConts"></div></div>
  </div>
  <div class="cb-outline" id="cbOutline"></div>
</div>

<!-- Редактор шаблонов карточек -->
<div id="cbTplModal">
  <div class="cb-tpl-panel">
    <h2>Шаблоны карточек</h2>
    <div class="cb-tpl-row">
      <label>Шаблон:</label>
      <select id="cbTplEditSelect"></select>
      <button id="cbTplNew" class="cb-mini">+ Новый</button>
      <span class="cb-spacer"></span>
      <button id="cbTplDelete" class="cb-mini cb-danger">Удалить шаблон</button>
    </div>
    <div class="cb-tpl-row">
      <label>Название:</label>
      <input type="text" id="cbTplName" placeholder="Например: Обувь стандарт">
      <label>Сетка:</label>
      <button id="cbTplRowMinus" class="cb-mini">−ряд</button>
      <span id="cbTplGridLabel">3×2</span>
      <button id="cbTplRowPlus" class="cb-mini">+ряд</button>
      <button id="cbTplColMinus" class="cb-mini">−кол</button>
      <button id="cbTplColPlus" class="cb-mini">+кол</button>
    </div>
    <div style="font-size:11px;color:#8a8680;margin-bottom:4px;">Имена слотов (видны в пустых слотах, в PDF и в списке):</div>
    <div class="cb-tpl-slots" id="cbTplSlots"></div>
    <div class="cb-tpl-foot">
      <button id="cbTplSave" class="cb-primary">Сохранить шаблон</button>
      <span class="cb-spacer"></span>
      <button id="cbTplClose">Закрыть</button>
    </div>
  </div>
</div>

<div id="cbDropOverlay">Отпустите, чтобы добавить фото</div>
<div id="cbToast"></div>
<div id="cbPrint"></div>

<input type="file" id="cbFileInput" accept="image/*" multiple style="display:none">
<input type="file" id="cbProjInput" accept=".cardboard,.json" style="display:none">

<script>
/* ============================================================
   Cardboard — логика приложения. Чистый JS, префикс cb*.

   Dual-mode:
     desktop (pywebview) — фото по абсолютным путям, миниатюры
       генерирует Python в памяти, проект = пути + структура,
       никаких копий файлов;
     browser (фолбэк)    — фото встраиваются в проект (dataURL).

   Модель данных:
     App.photos[]     — {id, name, path|null, dataUrl|null, w, h, missing}
     App.cards[]      — {id, title, category, rows, cols,
                         slots: [photoId|null], slotNames: [str]}
     App.containers[] — {id, title, size ('s'|'m'|'l'), photoIds: [], text}
     App.templates[]  — {id, name, rows, cols, slotNames: [str]}
                        (библиотека хранится в localStorage и в проекте)
   ============================================================ */

var App = {
  photos: [],
  cards: [],
  containers: [],
  templates: [],
  nextId: 1,
  dirty: false,
  projectPath: null,          /* путь к .cardboard (desktop) */
  activeTab: 'cards',         /* активная вкладка: cards | conts */
  watch: { handle: null, timer: null, seen: {} }
};

var MAX_SIDE = 1400;          /* макс. сторона фото при импорте (браузер), px */
var JPEG_Q = 0.85;
var IMG_EXT = /\.(jpe?g|png|gif|webp|tiff?|bmp)$/i;
var TPL_STORE = 'cardboard_templates';
/* Встроенные быстрые сетки (без имён слотов) */
var BUILTIN_GRIDS = [
  { key: '2x2', label: '2×2' },
  { key: '3x2', label: '3 ряда × 2' },
  { key: '3x3', label: '3×3' },
  { key: '1x2', label: '1 ряд × 2' },
  { key: '1x3', label: '1 ряд × 3' }
];

/* ---------- Режим работы ---------- */

function cbDesktop() {
  return !!(window.pywebview && window.pywebview.api);
}

function cbApi() { return window.pywebview.api; }

/* ---------- Утилиты ---------- */

function cbId() { return 'p' + (App.nextId++); }

function cbEsc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function cbToast(msg) {
  var t = document.getElementById('cbToast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(function () { t.style.display = 'none'; }, 2800);
}

function cbPhotoById(id) {
  for (var i = 0; i < App.photos.length; i++)
    if (App.photos[i].id === id) return App.photos[i];
  return null;
}

function cbUsedIds() {
  var used = {};
  App.cards.forEach(function (c) {
    c.slots.forEach(function (pid) { if (pid) used[pid] = true; });
  });
  App.containers.forEach(function (c) {
    c.photoIds.forEach(function (pid) { used[pid] = true; });
  });
  return used;
}

function cbMarkDirty() {
  App.dirty = true;
  if (cbDesktop()) cbApi().set_dirty(true);
}
function cbClearDirty() {
  App.dirty = false;
  if (cbDesktop()) cbApi().set_dirty(false);
}

window.addEventListener('beforeunload', function (e) {
  /* в desktop-режиме закрытие обрабатывает Python (диалоги при выходе) */
  if (App.dirty && !cbDesktop()) { e.preventDefault(); e.returnValue = ''; }
});

/* Разметка фото: миниатюра или заглушка «файл не найден» */
function cbImgHtml(photo, cls) {
  if (photo.dataUrl) return '<img class="' + (cls || '') + '" src="' + photo.dataUrl + '" alt="">';
  return '<div class="cb-missing-box" title="' + cbEsc(photo.path || photo.name) + '">файл не найден</div>';
}

/* ---------- Добавление фото в панель (общее для всех источников) ---------- */

function cbAddPhotos(list) {
  /* list: [{name, path?, dataUrl?, w, h}] */
  var added = 0;
  list.forEach(function (item) {
    var dup = App.photos.some(function (p) {
      return (item.path && p.path === item.path) || (!item.path && p.name === item.name);
    });
    if (dup) return;
    App.photos.push({
      id: cbId(), name: item.name, path: item.path || null,
      dataUrl: item.dataUrl || null, w: item.w || 0, h: item.h || 0,
      missing: false
    });
    added++;
  });
  if (added) { cbMarkDirty(); cbRenderTray(); }
  return added;
}

/* ---------- Импорт фото: браузерный путь (встраивание) ---------- */

function cbImportFileEmbedded(file, done) {
  if (!IMG_EXT.test(file.name)) { done(null); return; }
  var url = URL.createObjectURL(file);
  var img = new Image();
  img.onload = function () {
    var w = img.naturalWidth, h = img.naturalHeight;
    var scale = Math.min(1, MAX_SIDE / Math.max(w, h));
    var cw = Math.round(w * scale), ch = Math.round(h * scale);
    var cnv = document.createElement('canvas');
    cnv.width = cw; cnv.height = ch;
    var ctx = cnv.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, cw, ch);
    ctx.drawImage(img, 0, 0, cw, ch);
    URL.revokeObjectURL(url);
    done({ name: file.name, dataUrl: cnv.toDataURL('image/jpeg', JPEG_Q), w: cw, h: ch });
  };
  img.onerror = function () { URL.revokeObjectURL(url); done(null); };
  img.src = url;
}

function cbImportFilesEmbedded(files) {
  var list = Array.prototype.slice.call(files);
  var items = [], idx = 0;
  function next() {
    if (idx >= list.length) {
      var added = cbAddPhotos(items);
      cbToast(added ? 'Добавлено фото: ' + added : 'Новых фото нет');
      return;
    }
    cbImportFileEmbedded(list[idx++], function (item) { if (item) items.push(item); next(); });
  }
  next();
}

/* ---------- Импорт фото: кнопки ---------- */

document.getElementById('cbBtnImport').onclick = function () {
  if (cbDesktop()) {
    cbApi().pick_photos().then(function (list) {
      var added = cbAddPhotos(list || []);
      if (list && list.length) cbToast(added ? 'Добавлено фото: ' + added : 'Эти фото уже добавлены');
    });
  } else {
    document.getElementById('cbFileInput').click();
  }
};
document.getElementById('cbFileInput').onchange = function () {
  if (this.files.length) cbImportFilesEmbedded(this.files);
  this.value = '';
};
document.getElementById('cbBtnFolder').onclick = function () {
  cbApi().pick_folder().then(function (list) {
    var added = cbAddPhotos(list || []);
    if (list && list.length) cbToast('Из папки добавлено: ' + added);
  });
};

/* ---------- Drag-and-drop файлов на окно ---------- */

var dragDepth = 0;
document.addEventListener('dragenter', function (e) {
  if (e.dataTransfer && e.dataTransfer.types.indexOf('Files') !== -1) {
    dragDepth++;
    document.body.classList.add('cb-file-drag');
  }
});
document.addEventListener('dragleave', function () {
  if (dragDepth > 0 && --dragDepth === 0) document.body.classList.remove('cb-file-drag');
});
document.addEventListener('dragover', function (e) { e.preventDefault(); });
document.addEventListener('drop', function (e) {
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('cb-file-drag');
  if (!e.dataTransfer || !e.dataTransfer.files.length) return;
  if (cbDesktop()) {
    /* pywebview прописывает полный путь в File.pywebviewFullPath */
    var paths = [];
    for (var i = 0; i < e.dataTransfer.files.length; i++) {
      var fp = e.dataTransfer.files[i].pywebviewFullPath;
      if (fp) paths.push(fp);
    }
    if (paths.length) {
      cbApi().import_dropped(paths).then(function (list) {
        var added = cbAddPhotos(list || []);
        cbToast(added ? 'Добавлено фото: ' + added : 'Новых фото нет');
      });
      return;
    }
    /* пути недоступны — фолбэк на встраивание */
  }
  cbImportFilesEmbedded(e.dataTransfer.files);
});

/* ---------- Слежение за папкой (Capture One hot key) ----------
   В Capture One на хоткей вешается экспорт-рецепт в папку; Cardboard
   раз в 2 секунды подхватывает новые файлы из неё.
   Desktop: сканирует Python (по пути). Браузер: File System Access API. */

function cbWatchUi(on, label) {
  var st = document.getElementById('cbWatchStatus');
  st.style.display = on ? 'block' : 'none';
  if (label) st.textContent = 'Слежу за папкой: ' + label;
  document.getElementById('cbBtnWatch').textContent = on ? 'Остановить слежение' : 'Следить за папкой';
}

function cbWatchStart() {
  if (cbDesktop()) {
    cbApi().watch_pick().then(function (dir) {
      if (!dir) return;
      App.watch.timer = setInterval(function () {
        cbApi().watch_scan().then(function (list) {
          if (list && list.length) {
            var added = cbAddPhotos(list);
            if (added) cbToast('Из папки: +' + added + ' фото');
          }
        });
      }, 2000);
      cbWatchUi(true, dir);
      cbToast('Слежение включено');
    });
    return;
  }
  if (!window.showDirectoryPicker) {
    cbToast('В браузере слежение работает в Chrome/Edge. Либо запустите desktop-версию: python3 main.py');
    return;
  }
  window.showDirectoryPicker().then(function (handle) {
    App.watch.handle = handle;
    App.watch.seen = {};
    cbWatchScanBrowser();
    App.watch.timer = setInterval(cbWatchScanBrowser, 2000);
    cbWatchUi(true, handle.name);
    cbToast('Слежение включено: ' + handle.name);
  }).catch(function () { /* пользователь отменил выбор */ });
}

function cbWatchStop() {
  clearInterval(App.watch.timer);
  App.watch.timer = null;
  App.watch.handle = null;
  if (cbDesktop()) cbApi().watch_stop();
  cbWatchUi(false);
  cbToast('Слежение остановлено');
}

function cbWatchScanBrowser() {
  var h = App.watch.handle;
  if (!h) return;
  var fresh = [];
  var it = h.values();
  function step() {
    it.next().then(function (r) {
      if (r.done) {
        if (!fresh.length) return;
        var items = [], idx = 0;
        (function next() {
          if (idx >= fresh.length) {
            var added = cbAddPhotos(items);
            if (added) cbToast('Из папки: +' + added + ' фото');
            return;
          }
          cbImportFileEmbedded(fresh[idx++], function (item) { if (item) items.push(item); next(); });
        })();
        return;
      }
      var entry = r.value;
      if (entry.kind === 'file' && IMG_EXT.test(entry.name) && !App.watch.seen[entry.name]) {
        App.watch.seen[entry.name] = true;
        entry.getFile().then(function (f) { fresh.push(f); step(); });
        return;
      }
      step();
    }).catch(function () { cbWatchStop(); });
  }
  step();
}

document.getElementById('cbBtnWatch').onclick = function () {
  if (App.watch.timer) cbWatchStop(); else cbWatchStart();
};

/* ---------- Вкладки: Карточки / Доп. контент ---------- */

function cbSwitchTab(name) {
  App.activeTab = name;
  document.getElementById('cbTabCards').style.display = (name === 'cards') ? '' : 'none';
  document.getElementById('cbTabConts').style.display = (name === 'conts') ? '' : 'none';
  document.getElementById('cbTabBtnCards').classList.toggle('cb-tab-active', name === 'cards');
  document.getElementById('cbTabBtnConts').classList.toggle('cb-tab-active', name === 'conts');
  /* одна кнопка добавления — контекст зависит от вкладки */
  document.getElementById('cbBtnAdd').textContent = (name === 'cards') ? '+ Карточка' : '+ Контейнер';
  cbRenderOutline();
}

function cbUpdateTabLabels() {
  document.getElementById('cbTabBtnCards').textContent =
    'Карточки' + (App.cards.length ? ' · ' + App.cards.length : '');
  document.getElementById('cbTabBtnConts').textContent =
    'Доп. контент' + (App.containers.length ? ' · ' + App.containers.length : '');
  cbRenderOutline();
}

document.getElementById('cbTabBtnCards').onclick = function () { cbSwitchTab('cards'); };
document.getElementById('cbTabBtnConts').onclick = function () { cbSwitchTab('conts'); };

/* Контекстное добавление: вкладка «Карточки» -> карточка по шаблону,
   вкладка «Доп. контент» -> контейнер без шаблона */
document.getElementById('cbBtnAdd').onclick = function () {
  if (App.activeTab === 'conts') cbAddCont(); else cbAddCard();
};

/* ---------- Навигация по карточкам/контейнерам (правая панель) ---------- */

function cbRenderOutline() {
  var host = document.getElementById('cbOutline');
  var isCards = App.activeTab !== 'conts';
  var list = isCards ? App.cards : App.containers;
  var html = '<div class="cb-outline-title">' + (isCards ? 'Карточки' : 'Контейнеры') + '</div>';
  if (!list.length) {
    html += '<div class="cb-outline-empty">пока пусто</div>';
  }
  list.forEach(function (item, i) {
    var count = isCards
      ? item.slots.filter(function (x) { return x; }).length + '/' + item.slots.length
      : item.photoIds.length;
    html += '<button class="cb-outline-item" data-target="' + item.id + '" title="' + cbEsc(item.title) + '">';
    html += '<span class="cb-outline-num">' + (i + 1) + '.</span>' + cbEsc(item.title);
    html += '<span class="cb-outline-count">' + count + '</span>';
    html += '</button>';
  });
  host.innerHTML = html;
}

document.getElementById('cbOutline').addEventListener('click', function (e) {
  var btn = e.target.closest('.cb-outline-item');
  if (!btn) return;
  var id = btn.getAttribute('data-target');
  var el = document.querySelector('[data-cid="' + id + '"], [data-kid="' + id + '"]');
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

/* ---------- Ресайз галереи перетаскиванием границы ---------- */

var TRAY_W_KEY = 'cardboard_tray_width';

function cbInitResizer() {
  var tray = document.querySelector('.cb-tray');
  var rz = document.getElementById('cbResizer');
  try {
    var saved = parseInt(localStorage.getItem(TRAY_W_KEY), 10);
    if (saved) tray.style.width = Math.max(160, Math.min(720, saved)) + 'px';
  } catch (e) { /* приватный режим */ }
  rz.addEventListener('mousedown', function (e) {
    e.preventDefault();
    rz.classList.add('cb-dragging');
    document.body.classList.add('cb-resizing');
    function onMove(ev) {
      var w = Math.max(160, Math.min(720, ev.clientX - tray.getBoundingClientRect().left));
      tray.style.width = w + 'px';
    }
    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      rz.classList.remove('cb-dragging');
      document.body.classList.remove('cb-resizing');
      try { localStorage.setItem(TRAY_W_KEY, parseInt(tray.style.width, 10)); } catch (e) { }
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

cbInitResizer();

/* ---------- Попап «Поделиться» ---------- */

function cbSharePop(open) {
  var pop = document.getElementById('cbSharePop');
  pop.classList.toggle('cb-open', open === undefined ? !pop.classList.contains('cb-open') : open);
}

document.getElementById('cbBtnShare').onclick = function (e) {
  e.stopPropagation();
  cbSharePop();
};
document.getElementById('cbSharePop').addEventListener('click', function (e) {
  /* после выбора действия попап закрывается */
  if (e.target.closest('button')) cbSharePop(false);
});
document.addEventListener('click', function (e) {
  if (!e.target.closest('.cb-share-wrap')) cbSharePop(false);
});

/* ---------- Панель фото ---------- */

function cbRenderTray() {
  var grid = document.getElementById('cbTrayGrid');
  var filter = document.getElementById('cbFilter').value.toLowerCase();
  var used = cbUsedIds();
  var html = '';
  var shown = 0;
  App.photos.forEach(function (p) {
    if (filter && p.name.toLowerCase().indexOf(filter) === -1) return;
    shown++;
    var horiz = p.w > p.h ? ' cb-h' : '';
    html += '<div class="cb-thumb' + horiz + (used[p.id] ? ' cb-used' : '') + '" draggable="true" data-pid="' + p.id + '" title="' + cbEsc(p.name) + (p.path ? '\n' + cbEsc(p.path) : '') + '">';
    html += cbImgHtml(p);
    html += '</div>';
  });
  if (!App.photos.length) {
    html = '<div class="cb-tray-empty">Перетащите фото сюда,<br>нажмите «Добавить фото»<br>или включите слежение за папкой<br>экспорта Capture One</div>';
  }
  grid.innerHTML = html;
  var usedCount = Object.keys(used).length;
  document.getElementById('cbTrayStats').textContent =
    'Фото: ' + App.photos.length + (filter ? ' (показано ' + shown + ')' : '') + ' · в макете: ' + usedCount;
}

document.getElementById('cbFilter').oninput = function () { cbRenderTray(); };

document.getElementById('cbTrayGrid').addEventListener('dragstart', function (e) {
  var t = e.target.closest('.cb-thumb');
  if (t) e.dataTransfer.setData('text/plain', 'photo:' + t.getAttribute('data-pid'));
});

/* ---------- Шаблоны карточек ---------- */

function cbLoadTemplates() {
  try {
    var raw = localStorage.getItem(TPL_STORE);
    if (raw) App.templates = JSON.parse(raw) || [];
  } catch (e) { App.templates = []; }
}

function cbStoreTemplates() {
  try { localStorage.setItem(TPL_STORE, JSON.stringify(App.templates)); } catch (e) { /* квота */ }
}

function cbTplById(id) {
  for (var i = 0; i < App.templates.length; i++)
    if (App.templates[i].id === id) return App.templates[i];
  return null;
}

/* Выпадающий список шаблонов в топбаре: встроенные сетки + свои шаблоны */
function cbRenderTplSelect(keepValue) {
  var sel = document.getElementById('cbTplSelect');
  var cur = keepValue || sel.value || 'g:3x2';
  var html = '';
  BUILTIN_GRIDS.forEach(function (g) {
    html += '<option value="g:' + g.key + '">' + g.label + '</option>';
  });
  App.templates.forEach(function (t) {
    html += '<option value="t:' + t.id + '">' + cbEsc(t.name) + ' (' + t.rows + '×' + t.cols + ')</option>';
  });
  sel.innerHTML = html;
  sel.value = cur;
  if (!sel.value) sel.value = 'g:3x2';
}

/* --- Редактор шаблонов (модалка) --- */

var TplEdit = { current: null };   /* редактируемая копия шаблона */

function cbTplOpenModal() {
  cbTplEditSelectRender();
  var first = App.templates.length ? App.templates[0].id : null;
  cbTplEditLoad(first);
  document.getElementById('cbTplModal').classList.add('cb-open');
}

function cbTplCloseModal() {
  document.getElementById('cbTplModal').classList.remove('cb-open');
}

function cbTplEditSelectRender(selectedId) {
  var sel = document.getElementById('cbTplEditSelect');
  var html = '';
  if (!App.templates.length) html = '<option value="">— нет шаблонов —</option>';
  App.templates.forEach(function (t) {
    html += '<option value="' + t.id + '">' + cbEsc(t.name) + '</option>';
  });
  sel.innerHTML = html;
  if (selectedId) sel.value = selectedId;
}

function cbTplEditLoad(id) {
  var t = id ? cbTplById(id) : null;
  if (t) {
    TplEdit.current = JSON.parse(JSON.stringify(t));
  } else {
    TplEdit.current = { id: null, name: '', rows: 3, cols: 2, slotNames: ['', '', '', '', '', ''] };
  }
  cbTplEditRender();
}

function cbTplEditRender() {
  var t = TplEdit.current;
  document.getElementById('cbTplName').value = t.name;
  document.getElementById('cbTplGridLabel').textContent = t.rows + '×' + t.cols;
  var html = '';
  for (var r = 0; r < t.rows; r++) {
    html += '<div class="cb-tpl-slot-row">';
    for (var c = 0; c < t.cols; c++) {
      var idx = r * t.cols + c;
      html += '<input type="text" data-idx="' + idx + '" value="' + cbEsc(t.slotNames[idx] || '') + '" placeholder="Слот ' + (idx + 1) + '">';
    }
    html += '</div>';
  }
  document.getElementById('cbTplSlots').innerHTML = html;
}

function cbTplEditResize(dr, dc) {
  var t = TplEdit.current;
  /* собрать введённые имена перед пересборкой */
  cbTplEditCollect();
  t.rows = Math.max(1, Math.min(6, t.rows + dr));
  t.cols = Math.max(1, Math.min(6, t.cols + dc));
  var names = [];
  for (var i = 0; i < t.rows * t.cols; i++) names.push(t.slotNames[i] || '');
  t.slotNames = names;
  cbTplEditRender();
}

function cbTplEditCollect() {
  var t = TplEdit.current;
  var inputs = document.getElementById('cbTplSlots').querySelectorAll('input');
  for (var i = 0; i < inputs.length; i++) {
    t.slotNames[parseInt(inputs[i].getAttribute('data-idx'), 10)] = inputs[i].value;
  }
  t.name = document.getElementById('cbTplName').value;
}

document.getElementById('cbBtnTpl').onclick = cbTplOpenModal;
document.getElementById('cbTplClose').onclick = cbTplCloseModal;
document.getElementById('cbTplNew').onclick = function () { cbTplEditLoad(null); };
document.getElementById('cbTplEditSelect').onchange = function () { cbTplEditLoad(this.value); };
document.getElementById('cbTplRowMinus').onclick = function () { cbTplEditResize(-1, 0); };
document.getElementById('cbTplRowPlus').onclick = function () { cbTplEditResize(1, 0); };
document.getElementById('cbTplColMinus').onclick = function () { cbTplEditResize(0, -1); };
document.getElementById('cbTplColPlus').onclick = function () { cbTplEditResize(0, 1); };

document.getElementById('cbTplSave').onclick = function () {
  cbTplEditCollect();
  var t = TplEdit.current;
  if (!t.name) { cbToast('Дайте шаблону название'); return; }
  if (t.id) {
    var existing = cbTplById(t.id);
    existing.name = t.name;
    existing.rows = t.rows;
    existing.cols = t.cols;
    existing.slotNames = t.slotNames.slice();
  } else {
    t.id = 'tpl' + (App.nextId++);
    App.templates.push(JSON.parse(JSON.stringify(t)));
  }
  cbStoreTemplates();
  cbMarkDirty();
  cbTplEditSelectRender(t.id);
  cbRenderTplSelect('t:' + t.id);
  cbToast('Шаблон сохранён: ' + t.name);
};

document.getElementById('cbTplDelete').onclick = function () {
  var t = TplEdit.current;
  if (!t.id) return;
  if (!confirm('Удалить шаблон «' + t.name + '»? Существующие карточки не изменятся.')) return;

    if (App.templates[i].id === t.id) { App.templates.splice(i, 1); break; }
  }
  cbStoreTemplates();
  cbTplEditSelectRender();
  cbRenderTplSelect();
  cbTplEditLoad(App.templates.length ? App.templates[0].id : null);
};

/* ---------- Карточки ---------- */

function cbAddCard() {
  var v = document.getElementById('cbTplSelect').value;
  var rows = 3, cols = 2, slotNames = [], title = 'Карточка ' + (App.cards.length + 1);
  if (v.indexOf('g:') === 0) {
    var g = v.slice(2).split('x');
    rows = parseInt(g[0], 10); cols = parseInt(g[1], 10);
  } else if (v.indexOf('t:') === 0) {
    var tpl = cbTplById(v.slice(2));
    if (tpl) { rows = tpl.rows; cols = tpl.cols; slotNames = tpl.slotNames.slice(); }
  }
  var slots = [];
  for (var i = 0; i < rows * cols; i++) {
    slots.push(null);
    if (slotNames.length < i + 1) slotNames.push('');
  }
  App.cards.push({ id: cbId(), title: title, category: '', rows: rows, cols: cols, slots: slots, slotNames: slotNames });
  cbMarkDirty();
  cbRenderCards();
  cbSwitchTab('cards');
}

function cbCardById(id) {
  for (var i = 0; i < App.cards.length; i++)
    if (App.cards[i].id === id) return App.cards[i];
  return null;
}

function cbCardResize(card, rows, cols) {
  rows = Math.max(1, Math.min(6, rows));
  cols = Math.max(1, Math.min(6, cols));
  var filled = card.slots.filter(function (x) { return x; });
  var slots = [], names = [];
  for (var i = 0; i < rows * cols; i++) {
    slots.push(filled[i] || null);
    names.push(card.slotNames[i] || '');
  }
  if (filled.length > rows * cols) cbToast('Лишние фото убраны из карточки (не удалены)');
  card.rows = rows; card.cols = cols; card.slots = slots; card.slotNames = names;
  cbMarkDirty();
  cbRenderCards(); cbRenderTray();
}

function cbRenderCards() {
  cbUpdateTabLabels();
  var host = document.getElementById('cbCards');
  if (!App.cards.length) {
    host.innerHTML = '<div class="cb-empty-hint">Карточек пока нет — нажмите «+ Карточка». Фото перетаскиваются из левой панели в слоты. Шаблоны с именами слотов — кнопка «Шаблоны...».</div>';
    return;
  }
  var html = '';
  App.cards.forEach(function (card, ci) {
    html += '<div class="cb-card" data-cid="' + card.id + '">';
    html += '<div class="cb-card-head">';
    html += '<span class="cb-num">' + (ci + 1) + '.</span>';
    html += '<input type="text" class="cb-title" value="' + cbEsc(card.title) + '" data-f="title" placeholder="Название / артикул">';
    html += '<input type="text" class="cb-cat" value="' + cbEsc(card.category) + '" data-f="category" placeholder="Категория">';
    html += '<span class="cb-spacer"></span>';
    html += '<span class="cb-grid-ctl">Сетка ' + card.rows + '×' + card.cols + ' ';
    html += '<button data-act="row-" title="Меньше рядов">−ряд</button><button data-act="row+" title="Больше рядов">+ряд</button>';
    html += '<button data-act="col-" title="Меньше колонок">−кол</button><button data-act="col+" title="Больше колонок">+кол</button></span>';
    html += '<button class="cb-mini" data-act="up" title="Выше">↑</button>';
    html += '<button class="cb-mini" data-act="down" title="Ниже">↓</button>';
    html += '<button class="cb-mini" data-act="dup">Дубль</button>';
    html += '<button class="cb-mini cb-danger" data-act="del">Удалить</button>';
    html += '</div>';
    html += '<div class="cb-slots">';
    for (var r = 0; r < card.rows; r++) {
      html += '<div class="cb-slot-row">';
      for (var c = 0; c < card.cols; c++) {
        var idx = r * card.cols + c;
        var pid = card.slots[idx];
        var photo = pid ? cbPhotoById(pid) : null;
        var slotName = card.slotNames[idx] || '';
        html += '<div class="cb-slot' + (photo ? ' cb-filled' : '') + '" data-cid="' + card.id + '" data-idx="' + idx + '"' + (photo ? ' draggable="true"' : '') + '>';
        if (photo) {
          html += cbImgHtml(photo);
          if (slotName) html += '<span class="cb-slot-tag">' + cbEsc(slotName) + '</span>';
          html += '<div class="cb-slot-name">' + cbEsc(photo.name) + '</div>';
          html += '<button class="cb-slot-x" title="Убрать фото">×</button>';
        } else {
          html += '<span class="cb-slot-hint">' + (slotName ? cbEsc(slotName) : 'перетащите фото') + '</span>';
        }
        html += '</div>';
      }
      html += '</div>';
    }
    html += '</div></div>';
  });
  host.innerHTML = html;
}

document.getElementById('cbCards').addEventListener('click', function (e) {
  var slotX = e.target.closest('.cb-slot-x');
  if (slotX) {
    var slot = slotX.closest('.cb-slot');
    var card = cbCardById(slot.getAttribute('data-cid'));
    card.slots[parseInt(slot.getAttribute('data-idx'), 10)] = null;
    cbMarkDirty(); cbRenderCards(); cbRenderTray();
    return;
  }
  var btn = e.target.closest('button[data-act]');
  if (!btn) return;
  var cardEl = btn.closest('.cb-card');
  var card = cbCardById(cardEl.getAttribute('data-cid'));
  var i = App.cards.indexOf(card);
  var act = btn.getAttribute('data-act');
  if (act === 'del') {
    if (!confirm('Удалить карточку «' + card.title + '»? Фото останутся в панели слева.')) return;
    App.cards.splice(i, 1);
  } else if (act === 'dup') {
    var copy = JSON.parse(JSON.stringify(card));
    copy.id = cbId();
    copy.title = card.title + ' (копия)';
    App.cards.splice(i + 1, 0, copy);
  } else if (act === 'up' && i > 0) {
    App.cards.splice(i, 1); App.cards.splice(i - 1, 0, card);
  } else if (act === 'down' && i < App.cards.length - 1) {
    App.cards.splice(i, 1); App.cards.splice(i + 1, 0, card);
  } else if (act === 'row-') { cbCardResize(card, card.rows - 1, card.cols); return; }
  else if (act === 'row+') { cbCardResize(card, card.rows + 1, card.cols); return; }
  else if (act === 'col-') { cbCardResize(card, card.rows, card.cols - 1); return; }
  else if (act === 'col+') { cbCardResize(card, card.rows, card.cols + 1); return; }
  else return;
  cbMarkDirty(); cbRenderCards(); cbRenderTray();
});

document.getElementById('cbCards').addEventListener('input', function (e) {
  var f = e.target.getAttribute('data-f');
  if (!f) return;
  var card = cbCardById(e.target.closest('.cb-card').getAttribute('data-cid'));
  card[f] = e.target.value;
  cbMarkDirty();
});

document.getElementById('cbCards').addEventListener('dragstart', function (e) {
  var slot = e.target.closest('.cb-slot.cb-filled');
  if (slot) {
    e.dataTransfer.setData('text/plain', 'slot:' + slot.getAttribute('data-cid') + ':' + slot.getAttribute('data-idx'));
  }
});
document.getElementById('cbCards').addEventListener('dragover', function (e) {
  var slot = e.target.closest('.cb-slot');
  if (slot) { e.preventDefault(); slot.classList.add('cb-over'); }
});
document.getElementById('cbCards').addEventListener('dragleave', function (e) {
  var slot = e.target.closest('.cb-slot');
  if (slot) slot.classList.remove('cb-over');
});
document.getElementById('cbCards').addEventListener('drop', function (e) {
  var slot = e.target.closest('.cb-slot');
  if (!slot) return;
  e.preventDefault();
  e.stopPropagation();
  slot.classList.remove('cb-over');
  var data = e.dataTransfer.getData('text/plain');
  var card = cbCardById(slot.getAttribute('data-cid'));
  var idx = parseInt(slot.getAttribute('data-idx'), 10);
  if (data.indexOf('photo:') === 0) {
    card.slots[idx] = data.slice(6);
  } else if (data.indexOf('slot:') === 0) {
    var parts = data.split(':');
    var srcCard = cbCardById(parts[1]);
    var srcIdx = parseInt(parts[2], 10);
    if (srcCard === card && srcIdx === idx) return;
    var tmp = card.slots[idx];
    card.slots[idx] = srcCard.slots[srcIdx];
    srcCard.slots[srcIdx] = tmp;   /* обмен местами */
  } else return;
  cbMarkDirty(); cbRenderCards(); cbRenderTray();
});

/* ---------- Контейнеры (доп. контент) ---------- */

function cbAddCont() {

  cbMarkDirty();
  cbRenderConts();

}

function cbContById(id) {
  for (var i = 0; i < App.containers.length; i++)

  return null;
}

function cbRenderConts() {
  cbUpdateTabLabels();

    host.innerHTML = '<div class="cb-empty-hint">Контейнеры — свободные блоки для доп. контента: детали, стайлинг, видео-кадры. Нажмите «+ Контейнер».</div>';

document.getElementById('cbConts').addEventListener('click', function (e) {

  if (act === 'del') {
    if (!confirm('Удалить контейнер «' + cont.title + '»? Фото останутся в панели слева.')) return;
    App.containers.splice(i, 1);
  } else if (act === 'up' && i > 0) {
    App.containers.splice(i, 1); App.containers.splice(i - 1, 0, cont);
  } else if (act === 'down' && i < App.containers.length - 1) {
    App.containers.splice(i, 1); App.containers.splice(i + 1, 0, cont);
  } else return;
  cbMarkDirty(); cbRenderConts(); cbRenderTray();
});

document.getElementById('cbConts').addEventListener('input', function (e) {
  var f = e.target.getAttribute('data-f');
  if (!f) return;
  var cont = cbContById(e.target.closest('.cb-container').getAttribute('data-kid'));

});
document.getElementById('cbConts').addEventListener('change', function (e) {

    var cont = cbContById(e.target.closest('.cb-container').getAttribute('data-kid'));

  }
});

document.getElementById('cbConts').addEventListener('dragstart', function (e) {
  var item = e.target.closest('.cb-cont-item');
  if (item) {
    e.dataTransfer.setData('text/plain', 'cont:' + item.getAttribute('data-kid') + ':' + item.getAttribute('data-pi'));
  }
});
document.getElementById('cbConts').addEventListener('dragover', function (e) {
  var body = e.target.closest('.cb-container-body');
  if (body) {
    e.preventDefault();
    body.classList.add('cb-over');
    var item = e.target.closest('.cb-cont-item');
    if (item) item.classList.add('cb-over');
  }
});
document.getElementById('cbConts').addEventListener('dragleave', function (e) {
  var body = e.target.closest('.cb-container-body');
  if (body) body.classList.remove('cb-over');
  var item = e.target.closest('.cb-cont-item');
  if (item) item.classList.remove('cb-over');
});
document.getElementById('cbConts').addEventListener('drop', function (e) {
  var body = e.target.closest('.cb-container-body');
  if (!body) return;
  e.preventDefault();
  e.stopPropagation();
  body.classList.remove('cb-over');
  var cont = cbContById(body.getAttribute('data-kid'));
  var data = e.dataTransfer.getData('text/plain');
  var targetItem = e.target.closest('.cb-cont-item');
  var insertAt = targetItem ? parseInt(targetItem.getAttribute('data-pi'), 10) : cont.photoIds.length;
  if (data.indexOf('photo:') === 0) {
    var pid = data.slice(6);
    if (cont.photoIds.indexOf(pid) !== -1) { cbToast('Это фото уже в контейнере'); return; }
    cont.photoIds.splice(insertAt, 0, pid);
  } else if (data.indexOf('cont:') === 0) {
    var parts = data.split(':');
    var srcCont = cbContById(parts[1]);
    var srcIdx = parseInt(parts[2], 10);
    var moved = srcCont.photoIds[srcIdx];
    if (srcCont === cont) {
      srcCont.photoIds.splice(srcIdx, 1);
      if (insertAt > srcIdx) insertAt--;
      cont.photoIds.splice(insertAt, 0, moved);
    } else {
      if (cont.photoIds.indexOf(moved) !== -1) { cbToast('Это фото уже в контейнере'); return; }
      srcCont.photoIds.splice(srcIdx, 1);
      cont.photoIds.splice(insertAt, 0, moved);
    }
  } else return;
  cbMarkDirty(); cbRenderConts(); cbRenderTray();
});

/* ---------- Экспорт PDF (через печать) ---------- */

function cbExportPdf() {
  if (!App.cards.length && !App.containers.length) { cbToast('Нечего экспортировать'); return; }
  var name = document.getElementById('cbProjectName').value || 'Проект';
  var d = new Date();
  var dateStr = ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + d.getFullYear();
  var sizePx = { s: 90, m: 140, l: 220 };
  var html = '<div class="cbp-head"><h1>' + cbEsc(name) + '</h1>';
  html += '<div class="cbp-meta">Карточек: ' + App.cards.length + ' · Контейнеров: ' + App.containers.length + ' · ' + dateStr + ' · Cardboard</div></div>';

  if (App.cards.length) {
    html += '<div class="cbp-sec">Карточки</div>';
    App.cards.forEach(function (card, ci) {
      html += '<div class="cbp-block"><h2>' + (ci + 1) + '. ' + cbEsc(card.title);
      if (card.category) html += '<span class="cbp-cat">' + cbEsc(card.category) + '</span>';
      html += '</h2>';
      for (var r = 0; r < card.rows; r++) {
        html += '<div class="cbp-row">';
        for (var c = 0; c < card.cols; c++) {
          var idx = r * card.cols + c;
          var photo = card.slots[idx] ? cbPhotoById(card.slots[idx]) : null;
          var slotName = card.slotNames[idx] || '';
          html += '<div class="cbp-cell"><div class="cbp-cell-in">';
          if (photo && photo.dataUrl) html += '<img src="' + photo.dataUrl + '">';
          html += '</div>';
          if (slotName) html += '<div class="cbp-slotname">' + cbEsc(slotName) + '</div>';
          html += '</div>';
        }
        html += '</div>';
      }
      html += '</div>';
    });
  }
  if (App.containers.length) {
    html += '<div class="cbp-sec">Доп. контент</div>';
    App.containers.forEach(function (cont, ci) {
      html += '<div class="cbp-block"><h2>' + (ci + 1) + '. ' + cbEsc(cont.title) + '</h2><div class="cbp-flow">';
      cont.photoIds.forEach(function (pid) {
        var photo = cbPhotoById(pid);
        if (photo && photo.dataUrl) html += '<img src="' + photo.dataUrl + '" style="width:' + sizePx[cont.size] + 'px;height:' + sizePx[cont.size] + 'px;">';
      });
      html += '</div>';
      if (cont.text) html += '<div class="cbp-text">' + cbEsc(cont.text) + '</div>';
      html += '</div>';
    });
  }
  document.getElementById('cbPrint').innerHTML = html;
  var oldTitle = document.title;
  document.title = name;   /* имя PDF-файла в диалоге печати */
  window.print();
  document.title = oldTitle;
}

document.getElementById('cbBtnPdf').onclick = cbExportPdf;

/* ---------- Экспорт списка (CSV для Excel + TXT) ---------- */

function cbDownload(filename, text, mime) {
  var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
}

function cbCsvCell(s) { return '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"'; }

function cbExportList() {
  if (!App.cards.length && !App.containers.length) { cbToast('Нечего экспортировать'); return; }
  var name = document.getElementById('cbProjectName').value || 'Проект';
  var csv = 'Тип;Номер;Блок;Категория;Позиция;Слот;Файл;Путь\r\n';
  var txt = name + '\r\n' + new Date().toLocaleDateString('ru-RU') + '\r\n';
  App.cards.forEach(function (card, ci) {
    txt += '\r\n[Карточка ' + (ci + 1) + '] ' + card.title + (card.category ? ' (' + card.category + ')' : '') + '\r\n';
    card.slots.forEach(function (pid, si) {
      if (!pid) return;
      var photo = cbPhotoById(pid);
      if (!photo) return;
      var slotName = card.slotNames[si] || '';
      csv += ['Карточка', (ci + 1), cbCsvCell(card.title), cbCsvCell(card.category), (si + 1), cbCsvCell(slotName), cbCsvCell(photo.name), cbCsvCell(photo.path || '')].join(';') + '\r\n';
      txt += '  ' + (si + 1) + '. ' + (slotName ? slotName + ' — ' : '') + photo.name + (photo.path ? ' (' + photo.path + ')' : '') + '\r\n';
    });
  });
  App.containers.forEach(function (cont, ci) {
    txt += '\r\n[Контейнер ' + (ci + 1) + '] ' + cont.title + '\r\n';
    cont.photoIds.forEach(function (pid, pi) {
      var photo = cbPhotoById(pid);
      if (!photo) return;
      csv += ['Контейнер', (ci + 1), cbCsvCell(cont.title), '', (pi + 1), '', cbCsvCell(photo.name), cbCsvCell(photo.path || '')].join(';') + '\r\n';
      txt += '  ' + (pi + 1) + '. ' + photo.name + (photo.path ? ' (' + photo.path + ')' : '') + '\r\n';
    });
    if (cont.text) txt += '  Комментарий: ' + cont.text + '\r\n';
  });
  /* BOM, чтобы Excel корректно открыл кириллицу */
  cbDownload(name + ' — список.csv', '﻿' + csv, 'text/csv;charset=utf-8');
  cbDownload(name + ' — список.txt', txt);
  cbToast('Список выгружен (CSV + TXT)');
}

document.getElementById('cbBtnList').onclick = cbExportList;

/* ---------- Сохранение / загрузка проекта ----------
   Desktop: проект = ОДИН файл .cardboard с путями к фото — сами фото
   не копируются и не встраиваются (для фото без пути, например
   добавленных drag-and-drop без доступа к пути, встраивается миниатюра,
   чтобы проект оставался открываемым).
   Browser: фолбэк — всё встроено в файл. */

function cbProjectData() {
  var desktop = cbDesktop();
  return {
    app: 'cardboard',
    version: 2,
    name: document.getElementById('cbProjectName').value || 'Проект',
    savedAt: new Date().toISOString(),
    mode: desktop ? 'paths' : 'embedded',
    nextId: App.nextId,
    photos: App.photos.map(function (p) {
      return {
        id: p.id, name: p.name, path: p.path, w: p.w, h: p.h,
        /* в desktop-режиме встраиваем миниатюру только если пути нет */
        dataUrl: (desktop && p.path) ? null : p.dataUrl
      };
    }),
    cards: App.cards,
    containers: App.containers,
    templates: App.templates
  };
}

function cbSaveProject() {
  var data = cbProjectData();
  var json = JSON.stringify(data);
  if (cbDesktop()) {
    cbApi().save_project(data.name, json, false).then(function (path) {
      if (!path) return; /* отменено */
      App.projectPath = path;
      cbClearDirty();
      cbToast('Сохранено: ' + path);
    });
  } else {
    cbDownload(data.name + '.cardboard', json, 'application/json');
    cbClearDirty();
    cbToast('Проект сохранён: ' + data.name + '.cardboard');
  }
}

function cbApplyProject(data) {
  App.photos = (data.photos || []).map(function (p) {
    p.missing = false;
    return p;
  });
  App.cards = (data.cards || []).map(function (c) {
    if (!c.slotNames) {
      c.slotNames = [];
      for (var i = 0; i < c.slots.length; i++) c.slotNames.push('');
    }
    return c;
  });
  App.containers = data.containers || [];
  if (data.templates && data.templates.length) {
    /* шаблоны из проекта добавляются в библиотеку (без дублей по имени) */
    data.templates.forEach(function (t) {
      var exists = App.templates.some(function (x) { return x.name === t.name; });
      if (!exists) App.templates.push(t);
    });
    cbStoreTemplates();
    cbRenderTplSelect();
  }
  App.nextId = data.nextId || (App.photos.length + App.cards.length + App.containers.length + 100);
  document.getElementById('cbProjectName').value = data.name || 'Проект';
  cbClearDirty();
  cbRenderTray(); cbRenderCards(); cbRenderConts();
}

/* Desktop: восстановить миниатюры по путям; пропавшие пометить */
function cbRehydrateThumbs() {
  var paths = [];
  App.photos.forEach(function (p) { if (p.path && !p.dataUrl) paths.push(p.path); });
  if (!paths.length) return;
  cbApi().thumbs_for(paths).then(function (map) {
    var missing = 0;
    App.photos.forEach(function (p) {
      if (!p.path || p.dataUrl) return;
      var t = map[p.path];
      if (t) { p.dataUrl = t.dataUrl; p.w = t.w; p.h = t.h; }
      else { p.missing = true; missing++; }
    });
    cbRenderTray(); cbRenderCards(); cbRenderConts();
    if (missing) cbToast('Не найдено файлов: ' + missing + ' (пути изменились?)');
  });
}

function cbOpenProjectBrowser(file) {
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var data = JSON.parse(reader.result);
      if (data.app !== 'cardboard') throw new Error('not cardboard');
      cbApplyProject(data);
      cbToast('Проект открыт: ' + (data.name || file.name));
      if (data.mode === 'paths') cbToast('Проект сохранён в desktop-режиме — в браузере фото по путям недоступны');
    } catch (err) {
      cbToast('Не удалось открыть файл — это не проект Cardboard');
    }
  };
  reader.readAsText(file);
}

document.getElementById('cbBtnSave').onclick = cbSaveProject;
document.getElementById('cbBtnOpen').onclick = function () {
  if (App.dirty && !confirm('Есть несохранённые изменения. Открыть другой проект?')) return;
  if (cbDesktop()) {
    cbApi().open_project().then(function (res) {
      if (!res) return;
      if (!res.data) { cbToast('Не удалось прочитать файл проекта'); return; }
      var data = JSON.parse(res.data);
      if (data.app !== 'cardboard') { cbToast('Это не проект Cardboard'); return; }
      App.projectPath = res.path;
      cbApplyProject(data);
      cbRehydrateThumbs();
      cbToast('Проект открыт: ' + res.path);
    });
  } else {
    document.getElementById('cbProjInput').click();
  }
};
document.getElementById('cbProjInput').onchange = function () {
  if (this.files.length) cbOpenProjectBrowser(this.files[0]);
  this.value = '';
};
document.getElementById('cbProjectName').oninput = cbMarkDirty;

/* ---------- Инициализация ---------- */

function cbInitDesktopUi() {
  document.getElementById('cbBtnFolder').style.display = '';
  document.getElementById('cbMode').textContent = 'desktop';
}

window.addEventListener('pywebviewready', function () {
  cbInitDesktopUi();
});
/* на случай, если событие пришло до навешивания слушателя */
if (cbDesktop()) cbInitDesktopUi();

cbLoadTemplates();
cbRenderTplSelect();
cbRenderTray();
cbRenderCards();
cbRenderConts();
cbSwitchTab('cards');
</script>
</body>
</html>
